<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنوار طيبة - سلة المشتريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#0F172A', purple: '#7E22CE', gold: '#D4AF37' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; }
        .bottom-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.1); }
        .nav-item.active { transform: translateY(-15px); background-color: #7E22CE; color: white; border-radius: 50%; padding: 12px; box-shadow: 0 10px 15px -3px rgba(126, 34, 206, 0.4); }
        .modal-enter { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-enter-active { transform: translateY(0); }
    </style>
</head>
<body class="pb-24 text-navy">

    <header class="bg-navy text-white p-6 text-center rounded-b-3xl shadow-lg relative">
        <h1 class="text-2xl font-bold text-gold">سلة المشتريات</h1>
        <button class="absolute top-6 left-4 text-sm bg-white/10 px-3 py-1 rounded-full hover:bg-white/20 transition"><i class="fa-solid fa-clock-rotate-left ml-1"></i>مشتريات سابقة</button>
    </header>

    <main class="p-4 space-y-4">
        <!-- حاوية المنتجات الفارغة التي ستعُبأ برمجياً -->
        <div id="cartItemsContainer" class="space-y-4">
            <div class="text-center py-10 text-gray-400 font-bold">السلة فارغة حالياً</div>
        </div>

        <!-- الإجمالي -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mt-6">
            <div class="flex justify-between items-center mb-2 text-gray-500"><span>إجمالي المنتجات</span><span id="totalItemsCount">0</span></div>
            <div class="flex justify-between items-center text-xl font-black text-navy border-t pt-2 mt-2"><span>السعر الإجمالي</span><span id="totalPriceAmount" class="text-purple">0 ر.س</span></div>
        </div>

        <button onclick="openCheckoutModal()" class="w-full bg-gradient-to-r from-purple to-navy text-white font-black text-xl py-4 rounded-2xl shadow-lg shadow-purple/30 transform transition active:scale-95 mt-4">
            إتمام الشراء
        </button>
    </main>

    <!-- نافذة إتمام الشراء الخرافية -->
    <div id="checkoutModalOverlay" class="fixed inset-0 bg-navy/60 backdrop-blur-sm z-50 hidden transition-opacity opacity-0"></div>
    <div id="checkoutModal" class="fixed inset-x-0 bottom-0 z-50 hidden flex justify-center">
        <div id="checkoutModalContent" class="bg-white w-full md:w-96 rounded-t-3xl md:rounded-3xl p-6 shadow-2xl relative modal-enter">
            <button onclick="closeCheckoutModal()" class="absolute top-4 left-4 text-gray-400 hover:text-navy text-xl transition"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-black text-navy mb-6 text-center">اختر طريقة الاستلام</h2>
            
            <div class="space-y-4">
                <!-- الشراء العادي (استلام من الفرع) -->
                <button class="w-full text-right bg-gray-50 hover:bg-purple hover:text-white group border border-gray-200 rounded-2xl p-4 transition-all duration-300" onclick="alert('سيكون المنتج جاهزاً للاستلام الساعة 4:30 م\nالعنوان: تريم - السوق - شرقي عمائر باهاني - بجانب وكالة الغناء للهاتف النقال')">
                    <div class="flex items-center gap-4">
                        <div class="bg-white group-hover:text-purple text-navy p-3 rounded-full shadow-sm transition-colors"><i class="fa-solid fa-store text-xl"></i></div>
                        <div>
                            <h3 class="font-bold text-lg">استلام من الفرع</h3>
                            <p class="text-xs text-gray-500 group-hover:text-gray-200 mt-1 transition-colors">تريم - السوق - شرقي عمائر باهاني</p>
                        </div>
                    </div>
                </button>

                <!-- التوصيل -->
                <div class="border border-purple/30 rounded-2xl p-4 bg-purple/5 shadow-sm">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="bg-purple text-white p-3 rounded-full shadow-md"><i class="fa-solid fa-motorcycle text-xl"></i></div>
                        <div>
                            <h3 class="font-bold text-lg text-navy">توصيل سريع</h3>
                            <p class="text-xs text-purple font-bold">مقابل مبلغ رمزي بسيط</p>
                        </div>
                    </div>
                    <form class="space-y-3">
                        <input type="text" placeholder="الاسم الكريم" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm focus:border-purple focus:ring-2 focus:ring-purple/20 outline-none transition">
                        <input type="text" placeholder="الموقع الدقيق" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm focus:border-purple focus:ring-2 focus:ring-purple/20 outline-none transition">
                        <input type="tel" placeholder="رقم الواتساب" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm focus:border-purple focus:ring-2 focus:ring-purple/20 outline-none transition">
                        <div class="text-center py-3 text-sm text-yellow-800 font-bold bg-yellow-100 rounded-xl mt-4 border border-yellow-200 shadow-inner">
                            سيكون المنتج في خدمة التوصيل بين 5:00 م - 6:00 م
                        </div>
                        <button type="button" class="w-full bg-navy text-white font-bold py-3.5 rounded-xl hover:bg-purple shadow-lg transition mt-4">تأكيد الطلب</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav fixed bottom-0 w-full bg-white flex justify-around items-center p-3 z-40 rounded-t-3xl">
        <a href="around.html" class="nav-item flex flex-col items-center text-gray-400 hover:text-navy transition"><i class="fa-solid fa-circle-info text-xl"></i><span class="text-[10px] mt-1 font-bold">حول</span></a>
        <a href="Favorites.html" class="nav-item flex flex-col items-center text-gray-400 hover:text-navy transition"><i class="fa-regular fa-heart text-xl"></i><span class="text-[10px] mt-1 font-bold">المفضلة</span></a>
        <a href="index.html" class="nav-item flex flex-col items-center text-gray-400 hover:text-navy transition"><i class="fa-solid fa-house text-2xl"></i><span class="text-[10px] mt-1 font-bold">الرئيسية</span></a>
        <!-- الخانة النشطة: السلة -->
        <a href="basket.html" class="nav-item active flex flex-col items-center transition"><i class="fa-solid fa-cart-shopping text-xl"></i><span class="text-[10px] mt-1 font-bold">السلة</span></a>
        <a href="communication.html" class="nav-item flex flex-col items-center text-gray-400 hover:text-navy transition"><i class="fa-regular fa-comments text-xl"></i><span class="text-[10px] mt-1 font-bold">التواصل</span></a>
    </nav>

    <script>
        function openCheckoutModal() {
            const overlay = document.getElementById('checkoutModalOverlay');
            const modal = document.getElementById('checkoutModal');
            const content = document.getElementById('checkoutModalContent');
            overlay.classList.remove('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.add('modal-enter-active');
            }, 10);
        }
        function closeCheckoutModal() {
            const overlay = document.getElementById('checkoutModalOverlay');
            const content = document.getElementById('checkoutModalContent');
            overlay.classList.add('opacity-0');
            content.classList.remove('modal-enter-active');
            setTimeout(() => {
                overlay.classList.add('hidden');
                document.getElementById('checkoutModal').classList.add('hidden');
            }, 400);
        }
    </script>
</body>
</html>
