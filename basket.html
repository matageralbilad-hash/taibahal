<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنوار طيبة - سلة المشتريات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { navy: '#0F172A', purple: '#7E22CE', gold: '#D4AF37' }, fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; }
        .bottom-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.1); }
        .nav-item.active { transform: translateY(-15px); background-color: #7E22CE; color: white; border-radius: 50%; padding: 12px; box-shadow: 0 10px 15px -3px rgba(126, 34, 206, 0.4); }
    </style>
</head>
<body class="pb-24 text-navy">

    <header class="bg-navy text-white p-6 text-center rounded-b-3xl shadow-lg relative">
        <h1 class="text-2xl font-bold text-gold">سلة المشتريات</h1>
    </header>

    <main class="p-4 space-y-4">
        <!-- حاوية السلة الديناميكية -->
        <div id="cartItemsContainer" class="space-y-4"></div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mt-6">
            <div class="flex justify-between items-center mb-2 text-gray-500"><span>إجمالي المنتجات</span><span id="totalItemsCount">0</span></div>
            <div class="flex justify-between items-center text-xl font-black text-navy border-t pt-2 mt-2"><span>السعر الإجمالي</span><span id="totalPriceAmount" class="text-purple">0 ر.س</span></div>
        </div>

        <button onclick="document.getElementById('checkoutModalOverlay').classList.remove('hidden'); document.getElementById('checkoutModal').classList.remove('hidden');" class="w-full bg-gradient-to-r from-purple to-navy text-white font-black text-xl py-4 rounded-2xl shadow-lg mt-4">
            إتمام الشراء
        </button>
    </main>

    <!-- نافذة الشراء -->
    <div id="checkoutModalOverlay" class="fixed inset-0 bg-navy/60 backdrop-blur-sm z-50 hidden"></div>
    <div id="checkoutModal" class="fixed inset-x-0 bottom-0 z-50 hidden flex justify-center">
        <div class="bg-white w-full md:w-96 rounded-t-3xl p-6 shadow-2xl relative">
            <button onclick="document.getElementById('checkoutModalOverlay').classList.add('hidden'); document.getElementById('checkoutModal').classList.add('hidden');" class="absolute top-4 left-4 text-xl text-gray-500"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-black text-navy mb-6 text-center">طريقة الاستلام</h2>
            
            <!-- زر الاستلام من الفرع -->
            <button class="w-full text-right bg-gray-50 border border-gray-200 rounded-2xl p-4 mb-4 hover:bg-gray-100 transition" onclick="submitOrder('استلام من الفرع')">
                <h3 class="font-bold text-lg">استلام من الفرع</h3><p class="text-xs text-gray-500">تريم - السوق</p>
            </button>
            
            <!-- نموذج التوصيل -->
            <div class="border border-purple/30 rounded-2xl p-4 bg-purple/5">
                <h3 class="font-bold text-lg text-navy mb-4">توصيل سريع</h3>
                <input type="text" id="delName" placeholder="الاسم الكريم" class="w-full bg-white border border-gray-200 rounded-xl p-3 mb-2 text-sm focus:border-purple outline-none">
                <input type="text" id="delLocation" placeholder="الموقع" class="w-full bg-white border border-gray-200 rounded-xl p-3 mb-2 text-sm focus:border-purple outline-none">
                <input type="tel" id="delPhone" placeholder="رقم الواتساب" class="w-full bg-white border border-gray-200 rounded-xl p-3 mb-2 text-sm focus:border-purple outline-none">
                <button onclick="submitOrder('توصيل')" id="submitOrderBtn" class="w-full bg-navy text-white font-bold py-3 rounded-xl mt-2 hover:bg-purple transition">تأكيد الطلب</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav fixed bottom-0 w-full bg-white flex justify-around items-center p-3 z-40 rounded-t-3xl">
        <a href="Favorites.html" class="nav-item flex flex-col items-center text-gray-400"><i class="fa-regular fa-heart text-xl"></i><span class="text-[10px] mt-1 font-bold">المفضلة</span></a>
        <a href="index.html" class="nav-item flex flex-col items-center text-gray-400"><i class="fa-solid fa-house text-2xl"></i><span class="text-[10px] mt-1 font-bold">الرئيسية</span></a>
        <a href="basket.html" class="nav-item active flex flex-col items-center"><i class="fa-solid fa-cart-shopping text-xl"></i><span class="text-[10px] mt-1 font-bold">السلة</span></a>
    </nav>

    <!-- سكربت إدارة السلة المحلي -->
    <script>
        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('cartAnwar')) || [];
            const container = document.getElementById('cartItemsContainer');
            let totalQty = 0;
            let totalPrice = 0;

            if(cart.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-400 font-bold">السلة فارغة حالياً</div>';
                document.getElementById('totalItemsCount').innerText = '0';
                document.getElementById('totalPriceAmount').innerText = '0 ر.س';
                return;
            }

            container.innerHTML = cart.map(p => {
                const priceToUse = p.offerPrice ? p.offerPrice : p.price;
                totalQty += p.qty;
                totalPrice += (priceToUse * p.qty);
                const fallbackImg = "https://dummyimage.com/150x150/f3f4f6/0f172a.png&text=صورة";

                return `
                <div class="bg-white rounded-2xl p-3 flex gap-4 shadow-sm border border-gray-100 items-center">
                    <img src="${p.imageUrl || fallbackImg}" class="w-20 h-20 rounded-xl object-contain bg-gray-50">
                    <div class="flex-1">
                        <h3 class="font-bold text-sm text-navy line-clamp-1">${p.name}</h3>
                        <div class="text-purple font-black mt-1">${priceToUse} ر.س</div>
                        <div class="flex items-center gap-3 mt-2">
                            <button onclick="updateCartItem('${p.id}', 1)" class="w-6 h-6 bg-gray-100 rounded font-bold hover:bg-gray-200">+</button>
                            <span class="text-sm font-bold">${p.qty}</span>
                            <button onclick="updateCartItem('${p.id}', -1)" class="w-6 h-6 bg-gray-100 rounded font-bold hover:bg-gray-200">-</button>
                        </div>
                    </div>
                    <button onclick="removeFromCart('${p.id}')" class="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                </div>`;
            }).join('');

            document.getElementById('totalItemsCount').innerText = totalQty;
            document.getElementById('totalPriceAmount').innerText = totalPrice + ' ر.س';
        }

        window.updateCartItem = function(id, change) {
            let cart = JSON.parse(localStorage.getItem('cartAnwar')) || [];
            let item = cart.find(x => x.id === id);
            if(item) {
                item.qty += change;
                if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
                localStorage.setItem('cartAnwar', JSON.stringify(cart));
                renderCart();
            }
        };

        window.removeFromCart = function(id) {
            let cart = JSON.parse(localStorage.getItem('cartAnwar')) || [];
            cart = cart.filter(x => x.id !== id);
            localStorage.setItem('cartAnwar', JSON.stringify(cart));
            renderCart();
        };

        renderCart();
    </script>

    <!-- سكربت الإرسال إلى Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYA6S6xwjQcqP28M95QhCZiUg0QtIcDeY",
            authDomain: "taibah-79196.firebaseapp.com",
            databaseURL: "https://taibah-79196-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taibah-79196"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ordersRef = ref(db, 'orders');

        window.submitOrder = async function(orderType) {
            let cart = JSON.parse(localStorage.getItem('cartAnwar')) || [];
            if(cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let customerName = "عميل";
            let customerLocation = "استلام من الفرع";
            let customerPhone = "غير محدد";

            if (orderType === 'توصيل') {
                customerName = document.getElementById('delName').value;
                customerLocation = document.getElementById('delLocation').value;
                customerPhone = document.getElementById('delPhone').value;
                
                if(!customerName || !customerLocation || !customerPhone) {
                    alert("يرجى تعبئة جميع بيانات التوصيل (الاسم، الموقع، الرقم)");
                    return;
                }
                document.getElementById('submitOrderBtn').innerText = "جارٍ الإرسال...";
            } else {
                // طلب اسم سريع للاستلام من الفرع ليعرفه الأدمن
                let n = prompt("ما هو اسمك الكريم لتسجيل الطلب باسمك؟");
                if(n) customerName = n;
            }

            let totalPrice = 0;
            let formattedItems = cart.map(p => {
                let price = p.offerPrice ? p.offerPrice : p.price;
                totalPrice += (price * p.qty);
                return { id: p.id, name: p.name, qty: p.qty, price: price };
            });

            const orderData = {
                orderType: orderType,
                customerName: customerName,
                customerLocation: customerLocation,
                customerPhone: customerPhone,
                items: formattedItems,
                totalPrice: totalPrice,
                status: "جديد",
                timestamp: new Date().toISOString()
            };

            try {
                const newOrderRef = push(ordersRef);
                await set(newOrderRef, orderData);
                
                localStorage.removeItem('cartAnwar'); // تفريغ السلة بعد نجاح الطلب
                alert("تم استلام طلبك بنجاح! شكراً لاختيارك أنوار طيبة.");
                location.reload(); // تحديث الصفحة
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء إرسال الطلب. يرجى المحاولة مرة أخرى.");
                if(document.getElementById('submitOrderBtn')) document.getElementById('submitOrderBtn').innerText = "تأكيد الطلب";
            }
        };
    </script>
</body>
</html>
