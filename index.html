<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنوار طيبة - الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#0F172A', purple: '#7E22CE', gold: '#D4AF37' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }

    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; }
        .bottom-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.08); backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-item.active { transform: translateY(-18px); background: linear-gradient(135deg, #7E22CE, #4C1D95); color: white; border-radius: 50%; padding: 14px; box-shadow: 0 10px 20px -3px rgba(126, 34, 206, 0.5); border: 4px solid #F8FAFC; }
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.4s ease; }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .product-modal { transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-modal.open { transform: translateY(0); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24 text-navy">

    <header class="bg-navy text-white p-5 sticky top-0 z-40 shadow-2xl rounded-b-[2.5rem] relative overflow-hidden">
        <div class="absolute inset-0 bg-purple/10 blur-3xl rounded-full"></div>
        <div class="relative z-10 flex items-center justify-between mb-4">
            <h1 class="text-3xl font-black tracking-wider text-gold drop-shadow-md">أنوار طيبة</h1>
            <button class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center hover:bg-white/20 transition backdrop-blur-md">
                <i class="fa-solid fa-bell text-lg"></i>
            </button>
        </div>
        <p class="relative z-10 text-[11px] text-gray-300 mb-5 leading-loose font-bold opacity-90">
            وجهتكم الأولى لأحدث الإلكترونيات والساعات الذكية، وتشكيلة استثنائية من أرقى أدوات المنزل والمطبخ الفاخرة.
        </p>
        <div class="relative z-10">
            <input type="text" id="searchInput" onkeyup="window.handleSearch()" placeholder="ابحث عن أجهزة، جوالات..." class="w-full bg-white/10 border border-white/20 rounded-2xl py-4 px-12 text-white placeholder-gray-400 focus:outline-none focus:border-gold transition backdrop-blur-md font-bold">
            <i class="fa-solid fa-search absolute right-4 top-4 text-gray-400 text-xl"></i>

    <main class="p-4 space-y-10" id="mainContent">
        <div id="shelvesContainer" class="space-y-8 text-center py-10">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-purple mb-4"></i>
            <p class="font-bold text-gray-500">جارٍ تحميل المنتجات...</p>
        </div>
        <button id="showAllBtn" class="hidden w-full bg-white border-2 border-navy text-navy font-black py-4 rounded-2xl shadow-sm hover:bg-navy hover:text-white transition">عرض كل المنتجات</button>
    </main>

    <!-- Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-navy/70 backdrop-blur-sm z-[60] modal-overlay" onclick="closeProductModal()"></div>
    <div id="productModal" class="fixed inset-x-0 bottom-0 h-[85vh] bg-white z-[70] rounded-t-[2.5rem] product-modal flex flex-col shadow-2xl">
        <div class="w-full flex justify-center pt-3 pb-1" onclick="closeProductModal()"><div class="w-16 h-1.5 bg-gray-300 rounded-full"></div></div>
        <button onclick="closeProductModal()" class="absolute top-6 right-6 bg-white/80 w-10 h-10 rounded-full shadow-lg text-navy z-20 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
        
        <div class="h-2/5 bg-gray-50 relative p-4 flex items-center justify-center">
            <img id="modalImg" src="" class="max-h-full max-w-full object-contain rounded-2xl drop-shadow-xl" alt="Product">
        </div>

        <div class="flex-1 overflow-y-auto p-6 bg-white relative z-10 hide-scroll">
            <h2 id="modalTitle" class="text-2xl font-black mb-3 text-navy"></h2>
            <div id="modalPriceContainer" class="flex items-center gap-4 mb-4 bg-gray-50 p-3 rounded-2xl w-fit border border-gray-100"></div>
            <p id="modalDesc" class="text-gray-600 leading-relaxed mb-6 font-medium text-sm"></p>
            <h3 class="font-bold text-lg mb-2 text-navy border-r-4 border-gold pr-2">الملاحظات</h3>
            <p id="modalNotes" class="text-gray-500 text-sm mb-20 bg-yellow-50 p-3 rounded-xl border border-yellow-100"></p>
        </div>
        
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-100 p-4 pb-6 flex items-center gap-4 shadow-[0_-15px_30px_rgba(0,0,0,0.05)] z-20 rounded-t-3xl">
            <div class="flex items-center justify-between bg-gray-100 rounded-2xl p-1.5 w-1/3">
                <button onclick="updateQty(1)" class="w-10 h-10 bg-white rounded-xl shadow-sm text-navy font-bold text-xl">+</button>
                <span id="modalQty" class="font-black text-lg">1</span>
                <button onclick="updateQty(-1)" class="w-10 h-10 bg-white rounded-xl shadow-sm text-navy font-bold text-xl">-</button>
            </div>
            <button onclick="addToCartAndAnimate()" class="flex-1 bg-gradient-to-r from-purple to-navy text-white font-black text-lg py-3 rounded-2xl shadow-xl transform active:scale-95 flex justify-center items-center gap-2">
                اشترِ الآن <i class="fa-solid fa-cart-arrow-down animate-bounce"></i>
            </button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav fixed bottom-0 w-full flex justify-around items-center p-2 z-50 rounded-t-3xl pb-safe">
        <a href="Favorites.html" class="nav-item flex flex-col items-center text-gray-400"><i class="fa-regular fa-heart text-xl"></i><span class="text-[10px] mt-1 font-bold">المفضلة</span></a>
        <a href="communication.html" class="nav-item flex flex-col items-center text-gray-400"><i class="fa-regular fa-comments text-xl"></i><span class="text-[10px] mt-1 font-bold">التواصل</span></a>
        <a href="index.html" class="nav-item active flex flex-col items-center shadow-lg"><i class="fa-solid fa-house text-2xl"></i><span class="text-[10px] mt-1 font-bold">الرئيسية</span></a>
        <a href="basket.html" class="nav-item flex flex-col items-center text-gray-400 relative"><i class="fa-solid fa-cart-shopping text-xl"></i><span class="text-[10px] mt-1 font-bold">السلة</span></a>
        <a href="around.html" class="nav-item flex flex-col items-center text-gray-400"><i class="fa-solid fa-circle-info text-xl"></i><span class="text-[10px] mt-1 font-bold">حول</span></a>
    </nav>

    <script>
        var stopWords = ["افضل", "أفضل", "ارخص", "أرخص", "احسن", "أحسن", "خرافي", "جديد", "اصلي", "أصلي", "ممتاز", "قوي", "رخيص", "روعة", "فخم", "درجة", "اولى", "أولى", "تخفيض", "خصم", "عرض", "سعر", "اسعار", "أسعار", "شراء", "بيع", "متجر", "محل", "ماركة", "ضمان"];

        var dictionary = {
            "جوال": ["هاتف", "موبايل", "تلفون", "سمارتفون", "ايفون", "سامسونج", "شاومي", "هواوي", "ريدمي", "بوكو", "ريلمي", "انفينكس", "تكنو", "جوالات", "هواتف", "هاتف محمول"],
            "هاتف": ["جوال", "موبايل", "تلفون", "ايفون", "سامسونج"],
            "موبايل": ["جوال", "هاتف", "تلفون"],
            "ايفون": ["آيفون", "iphone", "ابل", "apple", "برو", "ماكس"],
            "سامسونج": ["samsung", "جالكسي", "galaxy", "الترا", "نوت"],
            "سماعة": ["سماعات", "ايربودز", "airpods", "هدفون", "headphone", "بلوتوث", "لاسلكية", "سبيكر", "مكبر"],
            "شاحن": ["شواحن", "كيبل", "سلك", "راس", "فيش", "واير", "شاحن سريع", "تايب سي", "type-c", "شاحن سفري", "باوربانك", "powerbank"],
            "باوربانك": ["شاحن سفري", "بنك طاقة", "بطارية متنقلة", "powerbank"],
            "شاشة": ["تلفزيون", "تلفاز", "شاشات", "tv", "سمارت", "smart", "led", "oled", "4k", "رسيفر"],
            "تلفزيون": ["شاشة", "تلفاز", "tv", "تلفزيونات"],
            "ساعة": ["ساعات", "ساعه", "يد", "ذكية", "smartwatch", "رولكس", "كاسيو", "سيتيزن", "حائط"],
            "ذكية": ["smart", "سمارت", "رياضية", "تتبع"],
            "خلاط": ["عصارة", "بلندر", "مفرمة", "كبة", "خلاطات", "عجانة", "عجانه", "مضرب", "طحانة", "مطحنة"],
            "فرن": ["ميكروويف", "مكرويف", "بوتجاز", "غاز", "طباخة", "فرن كهربائي", "قلاية", "قلايه", "هوائية", "airfryer"],
            "قلاية": ["قلاية هوائية", "ايرفراير", "بدون زيت", "فيليبس"],
            "غلاية": ["كتلي", "بويلر", "سخان ماء", "غلايه", "ابريق كهربائي"],
            "ثلاجة": ["براد", "فريزر", "ديب فريزر", "ثلاجه", "تبريد", "حافظة"],
            "غسالة": ["غساله", "اتوماتيك", "حوضين", "نشافة", "مجفف"],
            "مكواة": ["مكواه", "مكوى", "بخار", "كواية", "مكبس"],
            "مكنسة": ["مكنسه", "مكنسة كهربائية", "شفاط", "برميل", "لاسلكية"],
            "مكيف": ["سبليت", "صحراوي", "شباك", "تبريد", "مكيفات"],
            "مروحة": ["مروحه", "سقف", "عمودية", "حائط", "طاولة", "مراوح", "شحن"],
            "دفاية": ["مدفأة", "سخان", "شمعات"],
            "لمبة": ["لمبه", "اضاءة", "إضاءة", "ليد", "led", "كشاف", "سبوت لايت", "نجفة", "ثريا", "ابجورة", "انارة"],
            "توصيلة": ["مشترك", "توصيلات", "فيش", "مقبس", "سلك", "قاطع"],
            "ديكور": ["تحف", "ساعة حائط", "براويز", "ابجورة", "شريط ليد", "نيون"]
        };

        function normalizeArabic(text) {
            if (!text) return "";
            return text.toLowerCase().replace(/[إأآ]/g, "ا").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/ة/g, "ه").replace(/ـ/g, "").replace(/\bال/g, "").replace(/[^\u0621-\u064A0-9 ]/g, "").replace(/\s+/g, " ").trim();
        }

        function isStopWord(word) {
            var normalized = normalizeArabic(word);
            return stopWords.some(function(sw) { return normalized === sw || normalized.startsWith(sw); });
        }

        function getSynonyms(word) {
            var w = normalizeArabic(word);
            var variants = new Set();
            variants.add(w);
            if (typeof dictionary !== 'undefined' && dictionary[w]) {
                dictionary[w].forEach(function(syn) { variants.add(normalizeArabic(syn)); });
            }
            return Array.from(variants);
        }

        function productContainsWord(product, word) {
            var pName = normalizeArabic(product.name || "");
            var pCat = normalizeArabic((product.categories || []).join(" "));
            var pDesc = normalizeArabic(product.description || "");
            var synonyms = getSynonyms(word);
            return synonyms.some(function(syn) { return pName.includes(syn) || pCat.includes(syn) || pDesc.includes(syn); });
        }

        window.aiSafeSearch = function(allProducts, input) {
            if (!input || input.trim() === "") return allProducts.map(function(p) { return p.id; });
            var allSearchWords = input.split(/\s+/).filter(function(w) { return w.length > 1; });
            var searchWords = allSearchWords.filter(function(word) { return !isStopWord(word); });
            var finalWordsToUse = searchWords.length > 0 ? searchWords : allSearchWords;
            var totalWords = finalWordsToUse.length;
            var finalResults = [];
            var minMatch = totalWords;
            
            for (var matchCount = totalWords; matchCount >= minMatch; matchCount--) {
                var currentMatches = allProducts.filter(function(product) {
                    var foundCount = 0;
                    finalWordsToUse.forEach(function(word) {
                        if (productContainsWord(product, word)) foundCount++;
                    });
                    return foundCount === matchCount;
                });
                
                if (currentMatches.length > 0) {
                    finalResults = currentMatches.map(function(p) { return p.id; });
                    break;
                }
            }
            return finalResults;
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYA6S6xwjQcqP28M95QhCZiUg0QtIcDeY",
            authDomain: "taibah-79196.firebaseapp.com",
            databaseURL: "https://taibah-79196-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "taibah-79196"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allProducts = [];
        window.allProducts = allProducts; 

        window.getWords = function(text, count) {
            if (!text) return '';
            const words = text.split(' ');
            return words.length > count ? words.slice(0, count).join(' ') + ' ...' : text;
        }

        const shelvesConfig = [
            { id: 'الالكترونيات', title: 'الإلكترونيات والجوالات', img: 'https://images.unsplash.com/photo-1498049794561-7780e7231661?w=800&q=80' },
            { id: 'المنزل', title: 'أدوات المنزل والمطبخ', img: 'https://images.unsplash.com/photo-1556910103-1c02745a872f?w=800&q=80' },
            { id: 'الساعات', title: 'الساعات والرفاهية', img: 'https://images.unsplash.com/photo-1523170335258-f5ed11844a49?w=800&q=80' }
        ];

        onValue(ref(db, 'products'), (snapshot) => {
            const data = snapshot.val();
            allProducts = [];
            window.allProducts = allProducts;
            if(data) {
                Object.keys(data).forEach(key => {
                    allProducts.push({ id: key, ...data[key] });
                });
            }
            renderShelves(allProducts);
            document.getElementById('showAllBtn').classList.remove('hidden');
        });

        function renderShelves(productsToRender) {
            const container = document.getElementById('shelvesContainer');
            container.innerHTML = '';
            if(productsToRender.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-gray-500 font-bold">لا توجد منتجات مطابقة</div>';
                return;
            }

            shelvesConfig.forEach(shelf => {
                const shelfProducts = productsToRender.filter(p => (p.categories || []).includes(shelf.id));
                let shelfHtml = `
                <section class="shelf mb-10">
                    <div class="relative h-44 rounded-3xl overflow-hidden mb-5 shadow-lg bg-navy group">
                        <img src="${shelf.img}" class="w-full h-full object-cover opacity-50">
                        <div class="absolute inset-0 bg-gradient-to-t from-navy/90 to-transparent"></div>
                        <div class="absolute inset-0 flex flex-col justify-center items-center text-white p-4">
                            <h2 class="text-2xl font-black text-center">${shelf.title}</h2>
                            <span class="bg-gold/90 text-navy font-bold px-4 py-1.5 rounded-full text-xs mt-3">${shelfProducts.length} منتج</span>
                        </div>
                    </div>
                    <div class="flex overflow-x-auto gap-4 pb-4 snap-x hide-scroll">
                `;

                if (shelfProducts.length === 0) {
                    shelfHtml += `<div class="text-center w-full text-gray-400 text-sm py-4">سيتم الإضافة قريباً...</div>`;
                } else {
                    shelfProducts.forEach(p => {
                        const shortDesc = window.getWords(p.description, 8);
                        // صورة بديلة مضمونة في حال عدم توفر صورة
                        const fallbackImg = "https://dummyimage.com/200x200/f3f4f6/0f172a.png&text=لا+توجد+صورة";
                        const imgUrl = p.imageUrl || fallbackImg;
                        
                        let priceHtml = p.offerPrice ? 
                            `<span class="font-black text-purple text-lg">${p.offerPrice} ر.س</span><span class="line-through text-red-400 text-xs">${p.price} ر.س</span>` : 
                            `<span class="font-black text-purple text-lg">${p.price} ر.س</span>`;

                        shelfHtml += `
                        <div class="snap-center shrink-0 w-[200px] bg-white rounded-3xl shadow-sm border border-gray-100 p-3 relative flex flex-col justify-between" onclick="openProductModal('${p.id}')">
                            
                            <div class="absolute top-4 left-4 flex flex-col gap-2 z-20">
                                <button class="bg-white/90 p-2 rounded-full text-red-500 shadow-sm relative z-20" onclick="addToFavorites(event, '${p.id}')"><i class="fa-regular fa-heart"></i></button>
                                <button class="bg-white/90 p-2 rounded-full text-blue-500 shadow-sm relative z-20" onclick="shareProduct(event, '${p.id}')"><i class="fa-solid fa-share-nodes"></i></button>
                            </div>
                            
                            <div class="cursor-pointer">
                                <div class="h-36 bg-gray-50 rounded-2xl mb-3 flex items-center justify-center overflow-hidden">
                                    <img src="${imgUrl}" class="max-h-full object-contain" alt="صورة">
                                </div>
                                <h3 class="font-bold text-sm text-navy line-clamp-1 mb-1">${p.name}</h3>
                                <p class="text-[11px] text-gray-500 mb-2 h-8 overflow-hidden">${shortDesc}</p>
                                <div class="flex flex-col mb-3 bg-gray-50 p-2 rounded-xl border border-gray-100">${priceHtml}</div>
                            </div>
                            <button class="w-full bg-navy text-white text-sm font-bold py-2.5 rounded-xl mt-3 hover:bg-purple">افتح التفاصيل</button>
                        </div>
                        `;
                    });
                }
                shelfHtml += `</div></section>`;
                container.innerHTML += shelfHtml;
            });
        }

        window.currentProduct = null;
        let qty = 1;

window.handleSearch = function() {
            const input = document.getElementById('searchInput').value;
            if(!input.trim()) {
                window.renderShelves(window.allProducts);
                return;
            }
            const matchedIds = window.aiSafeSearch(window.allProducts, input);
            const results = window.allProducts.filter(p => matchedIds.includes(p.id));
            window.renderShelves(results);
        };

        window.openProductModal = function(id) {
            const p = window.allProducts.find(x => x.id === id);
            if(!p) return;
            window.currentProduct = p;
            qty = 1;
            document.getElementById('modalQty').innerText = qty;

            const fallbackImg = "https://dummyimage.com/400x400/f3f4f6/0f172a.png&text=لا+توجد+صورة";
            document.getElementById('modalImg').src = p.imageUrl || fallbackImg;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalDesc').innerText = p.description;
            document.getElementById('modalNotes').innerText = "تأكد من اختيار الكمية المناسبة. التجهيز فوري.";
            
            document.getElementById('modalPriceContainer').innerHTML = p.offerPrice ? 
                `<span class="text-3xl font-black text-purple">${p.offerPrice} <span class="text-lg">ر.س</span></span>
                 <div class="flex flex-col"><span class="line-through text-red-400 text-sm">${p.price} ر.س</span><span class="text-[10px] bg-red-500 text-white px-2 py-0.5 rounded-md mt-1">تخفيض!</span></div>` : 
                `<span class="text-3xl font-black text-purple">${p.price} <span class="text-lg">ر.س</span></span>`;

            document.getElementById('modalOverlay').classList.add('open');
            document.getElementById('productModal').classList.add('open');
        };

        window.closeProductModal = function() {
            document.getElementById('modalOverlay').classList.remove('open');
            document.getElementById('productModal').classList.remove('open');
        };

        window.updateQty = function(change) {
            if (qty + change >= 1) { qty += change; document.getElementById('modalQty').innerText = qty; }
        };

        // --- البرمجة الحقيقية للسلة والمفضلة والمشاركة ---
        
        window.addToCartAndAnimate = function() {
            const p = window.currentProduct;
            let cart = JSON.parse(localStorage.getItem('cartAnwar')) || [];
            let exist = cart.find(x => x.id === p.id);
            if(exist) { exist.qty += qty; } 
            else { p.qty = qty; cart.push(p); }
            
            localStorage.setItem('cartAnwar', JSON.stringify(cart));
            alert(`تم إضافة ${qty} من ${p.name} بنجاح إلى سلة الشراء!`);
            closeProductModal();
        };

        window.addToFavorites = function(e, id) {
            e.stopPropagation();
            const p = window.allProducts.find(x => x.id === id);
            if(!p) return;
            
            let favs = JSON.parse(localStorage.getItem('favAnwar')) || [];
            if(!favs.find(x => x.id === id)) {
                favs.push(p);
                localStorage.setItem('favAnwar', JSON.stringify(favs));
                alert('تم حفظ المنتج في المفضلة بنجاح!');
            } else {
                alert('هذا المنتج موجود بالفعل في المفضلة!');
            }
        };

        window.shareProduct = function(e, id) {
            e.stopPropagation();
            const p = window.allProducts.find(x => x.id === id);
            const shareText = `شاهد هذا المنتج الرائع: ${p.name} في أنوار طيبة!`;
            
            if (navigator.share) {
                navigator.share({ title: 'أنوار طيبة', text: shareText, url: window.location.href })
                .catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href + "?product=" + id);
                alert('تم نسخ رابط المنتج للمشاركة!');
            }
        };
    </script>
